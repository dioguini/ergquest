[project]
name = "ergquest"
version = "0.1.0"
description = "Mundo virtual endless onde o treino indoor por ERG é o trabalho do avatar."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bench = ["bleak==0.22.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ergquest*"]

[tool.setuptools.package-data]
ergquest = ["world/*.html", "bench/*.html"]
