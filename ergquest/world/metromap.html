<title>Lisboa Metropolitana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* separadores por modalidade em cima; mapa à esquerda; escada e aparelhos à direita; empilha em telemóvel */
:root{--bg:#f3f4f1;--panel:#ffffff;--fg:#1a1e1c;--muted:#5d6661;--line:#d9ddd8;--locked:#c3c8c4;--context:#d7dbd7;
--water:#3b82b8;--bridge:#1a1e1c;--accent:#0f766e;--zl:44%;--zs:62%;
--display:"Space Grotesk",system-ui,sans-serif;--body:Inter,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111413;--panel:#1a1e1c;--fg:#e7eae7;
--muted:#9aa39e;--line:#2c322f;--locked:#3a413d;--context:#262b28;--water:#5aa7dc;--bridge:#f1f3f1;--accent:#2dd4bf;
--zl:62%;--zs:58%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111413;--panel:#1a1e1c;--fg:#e7eae7;--muted:#9aa39e;--line:#2c322f;--locked:#3a413d;
--context:#262b28;--water:#5aa7dc;--bridge:#f1f3f1;--accent:#2dd4bf;--zl:62%;--zs:58%;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body)}
.wrap{max-width:1320px;margin:0 auto;padding-block:18px 24px;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 330px}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1;display:grid;gap:10px}
h1{font:600 1.55rem/1.15 var(--display);margin:0;text-wrap:balance}
.facts{color:var(--muted);font-variant-numeric:tabular-nums;margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:600 14px var(--body);padding:8px 14px;border-radius:999px;border:1px solid var(--line);
background:var(--panel);color:var(--fg);cursor:pointer;display:flex;gap:8px;align-items:center}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs button span{font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}
.stage{position:relative;min-width:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);
aspect-ratio:1/1;max-height:78vh}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);
font:600 16px var(--body);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mapname{position:absolute;left:12px;top:10px;font:600 13px var(--display);color:var(--muted);background:var(--panel);
border:1px solid var(--line);border-radius:6px;padding:3px 8px}
aside{display:grid;gap:14px;align-content:start;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.card h2{font:600 1rem/1.2 var(--display);margin:0}
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.lvl output{font:600 1.4rem var(--display);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
.note{color:var(--muted);font-size:13px;margin:0}
ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ol li{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:3px 0;font-variant-numeric:tabular-nums}
ol li i{width:12px;height:12px;border-radius:3px}
ol li.off{color:var(--muted)} ol li.off i{opacity:.35}
ol li small{color:var(--muted)}
ol li.bank{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.state{font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid var(--line)}
.on .state{border-color:var(--accent);color:var(--accent)}
.climb{display:grid;gap:2px} .climb b{font:600 15px var(--display)}
.climb span{color:var(--muted);font-variant-numeric:tabular-nums}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12.5px}
.keys i{display:inline-block;width:16px;height:3px;margin-right:6px;vertical-align:middle;border-radius:2px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)} th{color:var(--muted);font-weight:500}
td.n{text-align:right}
footer{grid-column:1/-1;color:var(--muted);font-size:12px}
[hidden]{display:none!important}
</style>
<div class="wrap">
<header><h1>Lisboa Metropolitana</h1>
<p class="facts" id="facts">A carregar o mapa…</p>
<div class="tabs" role="group" aria-label="Modalidade">
<button id="t-bike" aria-pressed="true">Ciclismo <span id="tl-bike"></span></button>
<button id="t-run" aria-pressed="false">Corrida <span id="tl-run"></span></button>
<button id="t-row" aria-pressed="false">Remo <span id="tl-row"></span></button>
</div></header>
<div class="stage"><canvas id="map" aria-label="Mapa da Área Metropolitana de Lisboa para a modalidade escolhida"></canvas>
<div class="mapname" id="mapname">Mapa de terra</div>
<div class="zoom"><button id="zin" aria-label="Aproximar">+</button><button id="zout" aria-label="Afastar">−</button>
<button id="zfit" aria-label="Ver tudo">⤢</button></div></div>
<aside>
<div class="card"><h2 id="lvl-title">Nível de ciclismo</h2>
<div class="lvl"><label for="level">Nível</label><input type="range" id="level" min="1" max="30" value="9"><output id="lvlout">9</output></div>
<p class="note" id="locks"></p><p class="note" id="devices"></p></div>
<div class="card"><h2 id="ladder-title">Zonas, por ordem de desbloqueio</h2><ol id="zones"></ol></div>
<div class="card" id="climbs-card"><h2>Serras</h2><div id="climbs" style="display:grid;gap:10px"></div></div>
<div class="card"><h2>Níveis por modalidade</h2><table id="compare"></table>
<p class="note">Cada modalidade evolui sozinha. Ciclismo e corrida partilham o mapa de terra e a escada de zonas; o remo tem o rio e a sua escada.</p></div>
</aside>
<footer id="foot"></footer>
</div>
<script>
(async function(){
const $=id=>document.getElementById(id);
let D;
try{D=await (await fetch("metro-map.json")).json();}
catch(e){$("facts").textContent="Não foi possível carregar os dados do mapa.";return;}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cv=$("map"),ctx=cv.getContext("2d");
const [x0,y0,x1,y1]=D.bounds;
const NAMES={bike:"ciclismo",run:"corrida",row:"remo"};
const S={sport:"bike",lv:{bike:9,run:4,row:1}};          // exemplo: a Ana da demonstração
let view={cx:(x0+x1)/2,cy:(y0+y1)/2,s:1},W=0,H=0,dpr=1,init=false;
const st=D.stats;
const isRow=()=>S.sport==="row";
const ladder=()=>isRow()?D.row_zones:D.land_zones;
const L=()=>S.lv[S.sport];
const zoneOf=id=>[...D.land_zones,...D.row_zones].find(z=>z.id===id);
$("foot").textContent="Dados: "+D.attribution;
function fit(){view={cx:(x0+x1)/2,cy:(y0+y1)/2,s:Math.min(W/(x1-x0),H/(y1-y0))*0.96};}
function resize(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;
cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);if(!init){fit();init=true;}draw();}
const tx=x=>(x-view.cx)*view.s+W/2, ty=y=>H/2-(y-view.cy)*view.s;
function line(a,start){ctx.moveTo(tx(a[start]),ty(a[start+1]));for(let i=start+2;i<a.length;i+=2)ctx.lineTo(tx(a[i]),ty(a[i+1]));}
const zcol=(z,on)=>on?`hsl(${z.hue} ${css("--zs")} ${css("--zl")})`:css("--locked");
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.lineCap="round";ctx.lineJoin="round";
 const lv=L(),k=Math.max(0.6,Math.min(2.2,view.s*60)),widths=[1.6,0.9,0.45,1.1,2.4];
 if(isRow()){
  // contexto: a terra a cinzento; o rio com as zonas do remo
  ctx.strokeStyle=css("--context");ctx.lineWidth=0.6*k;ctx.beginPath();
  for(const z of D.land_zones)for(const r of D.roads[z.id])if(r[0]<2)line(r,1);ctx.stroke();
  for(const z of D.row_zones){const on=lv>=z.level;ctx.strokeStyle=zcol(z,true);ctx.lineWidth=(on?4:2.6)*k;ctx.globalAlpha=on?1:.28;
   ctx.beginPath();for(const w of D.water[z.id])line(w,0);ctx.stroke();}
  ctx.globalAlpha=1;const cOn=lv>=D.crossing_level;ctx.strokeStyle=cOn?css("--fg"):css("--locked");ctx.lineWidth=2.4*k;
  ctx.setLineDash([3*k,4*k]);ctx.beginPath();for(const c of D.crossings)line(c.pts,0);ctx.stroke();ctx.setLineDash([]);
  ctx.lineWidth=1.6;for(const [x,y,z] of D.docks){const zz=zoneOf(z);const on=zz&&lv>=zz.level;
   ctx.fillStyle=css("--bg");ctx.strokeStyle=on?zcol(zz,true):css("--locked");ctx.beginPath();ctx.arc(tx(x),ty(y),3.2*k,0,7);ctx.fill();ctx.stroke();}
 }else{
  ctx.strokeStyle=css("--water");ctx.globalAlpha=.35;ctx.lineWidth=2*k;ctx.beginPath();
  for(const z of D.row_zones)for(const w of D.water[z.id])line(w,0);ctx.stroke();ctx.globalAlpha=1;
  const order=[...D.land_zones].sort((a,b)=>(lv>=a.level)-(lv>=b.level));
  for(const cls of [2,1,3,0,4])for(const z of order){const on=lv>=z.level;ctx.strokeStyle=zcol(z,on);ctx.globalAlpha=on?(cls==2?.75:1):.6;
   ctx.lineWidth=widths[cls]*k;if(cls==3)ctx.setLineDash([3*k,3*k]);ctx.beginPath();
   for(const r of D.roads[z.id])if(r[0]===cls)line(r,1);ctx.stroke();ctx.setLineDash([]);}
  ctx.globalAlpha=1;for(const b of D.bridges){const on=lv>=D.bridge_level;ctx.strokeStyle=on?css("--bridge"):css("--locked");
   ctx.lineWidth=(on?3.4:2.6)*k;ctx.setLineDash(on?[]:[4*k,3*k]);ctx.beginPath();for(const l of b.lines)line(l,0);ctx.stroke();}
  ctx.setLineDash([]);
 }
 ctx.font=`600 ${Math.round(11+2*Math.min(k,1.6))}px Space Grotesk, system-ui, sans-serif`;ctx.textBaseline="middle";
 ctx.lineWidth=3.5;ctx.strokeStyle=css("--bg");ctx.fillStyle=css("--fg");
 const text=(t,X,Y,gap)=>{const w=ctx.measureText(t).width,left=X+gap+w>W-8;const p=left?X-gap-w:X+gap;ctx.strokeText(t,p,Y);ctx.fillText(t,p,Y);};
 for(const [n,x,y] of D.labels){const X=tx(x),Y=ty(y);if(X<-50||X>W+50||Y<-20||Y>H+20)continue;text(n,X,Y,5);}
 if(!isRow())for(const c of D.climbs){if(c.x==null)continue;const X=tx(c.x),Y=ty(c.y);ctx.beginPath();ctx.moveTo(X,Y-9);ctx.lineTo(X+7,Y+4);
  ctx.lineTo(X-7,Y+4);ctx.closePath();ctx.fillStyle=css("--fg");ctx.fill();text(`${c.name} · ${c.ele} m`,X,Y,10);}
}
function panel(){
 const lv=L(),sp=S.sport;
 for(const s of ["bike","run","row"]){$("t-"+s).setAttribute("aria-pressed",s===sp);$("tl-"+s).textContent="nível "+S.lv[s];}
 $("level").value=lv;$("lvlout").textContent=lv;$("lvl-title").textContent="Nível de "+NAMES[sp];
 $("mapname").textContent=isRow()?"Mapa do rio (remo)":"Mapa de terra (ciclismo e corrida)";
 $("facts").textContent=isRow()
  ?`Rio Tejo · ${st.water_km} km de faixas de remo · ${st.docks} docas · 4 travessias entre margens`
  :`Terra · ${st.junctions.toLocaleString("pt-PT")} interseções · ${Math.round(st.bike_km).toLocaleString("pt-PT")} km só em asfalto e calçada · o mesmo mapa para ciclismo e corrida`;
 $("ladder-title").textContent=isRow()?"Zonas do rio, por ordem de desbloqueio":"Zonas de terra, por ordem de desbloqueio";
 const zl=$("zones");zl.innerHTML="";let bank="";
 for(const z of ladder()){if(z.bank!==bank){bank=z.bank;const h=document.createElement("li");h.className="bank";
  h.textContent=bank==="norte"?(isRow()?"Margem norte do rio":"Margem norte"):(isRow()?"Margem sul (pelas travessias)":"Margem sul (pelas pontes)");zl.appendChild(h);}
  const on=lv>=z.level,li=document.createElement("li");li.className=on?"on":"off";
  li.innerHTML=`<i style="background:hsl(${z.hue} ${css("--zs")} ${css("--zl")})"></i><span>${z.name} <small>· nível ${z.level}</small></span><span class="state">${on?"aberta":"fechada"}</span>`;
  zl.appendChild(li);}
 $("locks").textContent=isRow()
  ?`Travessias entre margens: ${lv>=D.crossing_level?"abertas":"fechadas"} (nível ${D.crossing_level} de remo). A partir daí os pedidos podem ligar as duas margens.`
  :`Pontes sobre o Tejo: ${lv>=D.bridge_level?"abertas":"fechadas"} (nível ${D.bridge_level} de ${NAMES[sp]}).`;
 $("devices").textContent=`Para ${NAMES[sp]} é preciso ${D.devices[sp]} ligado por Bluetooth ou ANT+; banda cardíaca recomendada.`;
 $("climbs-card").hidden=isRow();
 const rows=[["Zona","Ciclismo","Corrida","Remo"]];
 for(const z of D.land_zones)rows.push([z.name,z.level,z.level,""]);
 for(const z of D.row_zones)rows.push([z.name,"","",z.level]);
 $("compare").innerHTML=rows.map((r,i)=>`<tr>${r.map((c,j)=>i?`<td class="${j?"n":""}">${c}</td>`:`<th>${c}</th>`).join("")}</tr>`).join("");
 draw();
}
for(const s of ["bike","run","row"])$("t-"+s).onclick=()=>{S.sport=s;panel();};
$("climbs").innerHTML=D.climbs.map(c=>`<div class="climb"><b>${c.name}</b><span>${c.up_km} km a ${c.avg} % · cume a ${c.ele} m · ${(zoneOf(c.zone)||{}).name||""}</span></div>`).join("");
$("level").addEventListener("input",e=>{S.lv[S.sport]=+e.target.value;panel();});
const pts=new Map();let last=null;
function zoomAt(f,px,py){const wx=(px-W/2)/view.s+view.cx,wy=view.cy-(py-H/2)/view.s;view.s*=f;
 view.cx=wx-(px-W/2)/view.s;view.cy=wy+(py-H/2)/view.s;draw();}
cv.addEventListener("wheel",e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);cv.classList.add("drag");last=null;});
cv.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size===1){view.cx-=(e.clientX-prev[0])/view.s;view.cy+=(e.clientY-prev[1])/view.s;draw();}
 else if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
  if(last){const r=cv.getBoundingClientRect();zoomAt(d/last,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top);}last=d;}});
const up=e=>{pts.delete(e.pointerId);if(!pts.size)cv.classList.remove("drag");last=null;};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
$("zin").onclick=()=>zoomAt(1.5,W/2,H/2);$("zout").onclick=()=>zoomAt(1/1.5,W/2,H/2);$("zfit").onclick=()=>{fit();draw();};
new ResizeObserver(resize).observe(cv);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",panel);
new MutationObserver(panel).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
panel();
})();
</script>
